<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        viewport-fit=cover
    "
>

    <meta
    name="theme-color"
    content="#050a09"

    >

    <link
        rel="manifest"
        href="{{ url_for('pwa_manifest') }}"
    >


    <meta
        name="mobile-web-app-capable"
        content="yes"
    >


    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >


    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >


    <meta
        name="apple-mobile-web-app-title"
        content="Ojek Pribadi"
    >


    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="{{
            url_for(
                'static',
                filename='icons/apple-touch-icon.png',
                v='phase26c-1'
            )
        }}"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{{
            url_for(
                'static',
                filename='icons/favicon-32.png',
                v='phase26c-1'
            )
        }}"
    >


    <!-- =====================================================
         PHASE 26C
         iPHONE / iPAD WEB APP STARTUP IMAGES
    ====================================================== -->

    <link
        rel="apple-touch-startup-image"
        href="{{ url_for('static', filename='splash/iphone-5-se1.png', v='phase26c-1') }}"
        media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    >

        rel="apple-touch-startup-image"

    >

    <title>
        {% block title %}Ojek Pribadi{% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    

    <link
    rel="stylesheet"
    href="{{
        url_for(
            'static',
            filename='css/style.css',
            v='destination-fixed-v6'
        )
    }}"
>

    <link
    rel="stylesheet"
    href="{{ url_for('static',filename='css/dark-premium.css',v='phase20f-1') }}"
    >

    {% block head %}{% endblock %}
</head>

<body>

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}

    <script
    src="{{ url_for(
        'static',
        filename='js/pwa.js',
        v='phase26c-1'
    ) }}"
    defer
></script>

</body>

</html>
